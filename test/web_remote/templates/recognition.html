{% extends "base.html" %}
{% block content %}
<section class="card"><h2>Camera</h2><div id="camera-selector" class="camera-selector"></div><p id="camera-error" class="muted small"></p></section>
<section class="card">
  <h2>Camera trực tiếp</h2>
  <div class="video-wrap direct-preview-small"><canvas id="video" width="960" height="540"></canvas></div>
  <h2>Khung hình nhận diện</h2>
  <div class="video-wrap recognition-view"><canvas id="ai-video" width="960" height="540"></canvas><div id="rec-thumbnails" class="face-thumbnails" aria-label="Các khuôn mặt nhận diện"></div></div>
  <div class="btn-row"><button class="btn btn-primary" id="btn-rec-start">BẮT ĐẦU NHẬN DIỆN</button><button class="btn btn-danger" id="btn-rec-stop" disabled>DỪNG</button></div>
  <div id="rec-message" class="big-status"></div><p id="rec-recording" class="muted small"></p>
</section>
<section class="card"><h2>Kết quả SCRFD + AdaFace</h2><div id="rec-face-list" aria-live="polite"><p class="muted">Chưa có kết quả nhận diện.</p></div></section>
{% endblock %}
